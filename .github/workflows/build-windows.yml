name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable Windows app
        shell: powershell
        run: .\build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERNI-Live-Clipper-Windows
          path: dist/ERNI Live Clipper Updated Windows.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ERNI Live Clipper $tag" --generate-notes
          }
          gh release upload $tag "dist\ERNI Live Clipper Updated Windows.zip" --clobber
